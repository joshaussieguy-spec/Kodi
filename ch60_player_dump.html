class LiveLoader {

    }

  }

      playlistToken().then(t => {
        if (!req.aborted) this.load(context, config, callbacks, t || '', retried);
      });
      return;
    }
    const stats = this.stats;
    stats.loading.start = performance.now();
    stats.loading.first = 0;
    stats.loading.end = 0;
    stats.loaded = 0;
    stats.total = 0;
    stats.aborted = false;

    const isManifest = context.type === 'manifest' || context.type === 'level';

    // first segments. The default 10s manifest timeout expires before that.
    let timeout = (config && config.timeout) || 60000;
    if (isManifest && timeout < CFG.manifest_timeout_ms) timeout = CFG.manifest_timeout_ms;
    if (isFrag && timeout < CFG.frag_timeout_ms) timeout = CFG.frag_timeout_ms;
    let url = context.url;
    if (isManifest) {
      url = cleanPlaylistUrl(url);
      url += (url.includes('?') ? '&' : '?') + (token ? 't=' + encodeURIComponent(token) + '&' : '') + '_=' + Date.now();

        stats.loading.end = Math.max(performance.now(), stats.loading.first);

            return;
          }

          callbacks.onSuccess(response, stats, context, xhr);
          return;
        }

            const data = response.data;

            if (req.aborted) return;

        // once without surfacing an error or using up a playlist retry.

}

const p2pConfig = CFG.p2p ? {
  live: true,
  token: 'ntv',
  channelId: CHANNEL,
  announce: 'https://ann.cdn-lab.shop/v1',
  showSlogan: false,
  sharePlaylist: false,
  startFromSegmentOffset: 0,
  trickleICE: true,
  useHttpRange: false,
  p2pEnabled: true,
} : { p2pEnabled: false };

// A fragment retry must not reload the playlist. hls.js already retries the
// piece. Restarting the load on every error sends every viewer back to the edge.
let lastLoadRestart = 0;
function restartLoad(hls) {
  const now = performance.now();
  if (now - lastLoadRestart < CFG.reload_cooldown_ms) return false;
  lastLoadRestart = now;
  try { hls.startLoad(); return true; } catch (_) { return false; }
}

function bufferedAhead(video) {
  const t = video.currentTime;
  const ranges = video.buffered;
  if (!isFinite(t) || !ranges) return 0;
  for (let i = 0; i < ranges.length; i++) {
    try {
      if (t >= ranges.start(i) - 0.05 && t <= ranges.end(i)) return ranges.end(i) - t;
    } catch (_) {}
  }
  return 0;
}

// The next segment can already be downloaded and buffered while the picture
// sits at a gap in front of it. Step onto that segment. Never move while the
// current range still has video left, and never jump to the live edge.
let lastHoleSkip = 0;
function skipBufferedHole(video) {
  const now = performance.now();
  if (now - lastHoleSkip < CFG.hole_skip_ms) return false;
  const t = video.currentTime;
  const ranges = video.buffered;
  if (!isFinite(t) || !ranges || ranges.length === 0) return false;
  let rangeEnd = null;
  let nextStart = null;
  for (let i = 0; i < ranges.length; i++) {
    let start, end;
    try { start = ranges.start(i); end = ranges.end(i); } catch (_) { continue; }
    if (t >= start - 0.05 && t <= end + 0.05) {
      if (rangeEnd === null || end > rangeEnd) rangeEnd = end;
      continue;
    }
    if (start > t + 0.02 && (nextStart === null || start < nextStart)) nextStart = start;
  }
  if (rangeEnd !== null && rangeEnd - t > 0.25) return false;
  if (nextStart === null) return false;
  const from = rangeEnd !== null ? rangeEnd : t;
  const gap = nextStart - from;
  if (!(gap > 0.02 && gap <= 8)) return false;
  lastHoleSkip = now;
  try { video.currentTime = nextStart + 0.05; } catch (_) { return false; }
  return true;
}

// Seek just past one bad live fragment. A jump to the live edge warps audio,
// so this only moves when the gap is the same size as a stall hole.
function skipFailedFrag(video, frag) {
  if (skipBufferedHole(video)) return true;
  if (!frag || !isFinite(frag.start)) return false;
  const dur = isFinite(frag.duration) && frag.duration > 0 ? frag.duration : 0;
  const target = frag.start + dur + 0.05;
  const gap = target - video.currentTime;
  if (!(gap > 0.3 && gap <= 15)) return false;
  const now = performance.now();
  if (now - lastHoleSkip < CFG.hole_skip_ms) return false;
  lastHoleSkip = now;
  try { video.currentTime = target; } catch (_) { return false; }
  return true;
}

let fragStuckTimer = 0;
function recoverFrag(video, hls, frag, detail) {
  skipFailedFrag(video, frag);
  clearTimeout(fragStuckTimer);
  const stuckAt = video.currentTime;
  fragStuckTimer = setTimeout(function() {
    const moved = Math.abs(video.currentTime - stuckAt) > 0.25;
    if (moved || video.readyState >= 3) return;
    if (!restartLoad(hls)) show('Network error: ' + detail);
  }, CFG.stuck_wait_ms);
}

function bindTapToPlay(video) {
  const tryPlay = () => video.play().then(hide).catch(() => {});
  tryPlay();
  setTimeout(function() {
    if (video.paused && !video.ended) {
      show('Tap to play');
      msg.style.cursor = 'pointer';
      msg.onclick = function() { tryPlay(); msg.onclick = null; msg.style.cursor = ''; };
    }
  }, 1800);
}

function bindUnmute(player) {
  const btn = document.getElementById('unmute');
  if (!btn || btn._lwBound) return;
  btn._lwBound = true;
  if (!btn._lwVolume) btn._lwVolume = 100;
  let soundLock = 0;
  function video() { return document.querySelector('#player video'); }
  function mutedNow() {
    try { if (player.getMute()) return true; } catch (_) {}
    const v = video();
    return !v || v.muted || v.volume === 0;
  }
  // Only restore sound the player lost on its own. Never touch a volume the
  // viewer set: the slider must keep whatever level they picked.
  function applySound(v) {
    if (!btn._lwSound || !v) return;
    if (v._lwSoundSet && !v.muted) return;
    v._lwSoundSet = true;
    v.muted = false;
    v.volume = btn._lwVolume / 100;
    try { if (player.getMute()) player.setMute(false); } catch (_) {}
    try { if (Math.round(player.getVolume()) !== btn._lwVolume) player.setVolume(btn._lwVolume); } catch (_) {}
  }
  function syncUnmute() { btn.hidden = !mutedNow(); }
  btn.addEventListener('click', function() {
    btn._lwSound = true;
    soundLock = performance.now();
    try { player.setMute(false); } catch (_) {}
    try { player.setVolume(btn._lwVolume); } catch (_) {}
    const v = video();
    if (v) {
      v._lwSoundSet = true;
      v.muted = false;
      v.volume = btn._lwVolume / 100;
      const play = v.play();
      if (play && play.catch) play.catch(function() {});
    }
    syncUnmute();
  });
  try { player.on('mute', function() {
    if (performance.now() - soundLock < 400) return;
    try { btn._lwSound = !player.getMute(); } catch (_) {}
    syncUnmute();
  }); } catch (_) {}
  try { player.on('volume', function(e) {
    const level = e && typeof e.volume === 'number' ? Math.round(e.volume) : NaN;
    if (level > 0) btn._lwVolume = Math.min(100, level);
    syncUnmute();
  }); } catch (_) {}
  // A recovered player builds a new muted video element. Keep the choice
  // the viewer already made, or the picture comes back with no sound.
  setInterval(function() {
    const v = video();
    if (!v) return;
    if (!v._lwVol) {
      v._lwVol = true;
      v.addEventListener('volumechange', syncUnmute);
    }
    applySound(v);
    syncUnmute();
  }, 500);
  syncUnmute();
}

function bindWakeLock(media) {
  if (!CFG.wake_lock || !media || media._lwWake || !navigator.wakeLock) return;
  media._lwWake = true;
  let sentinel = null;
  let held = false;

  function drop() {
    const current = sentinel;
    sentinel = null;
    if (!current) return;
    current.release().catch(function() {});
  }

  function grab() {
    if (!held || sentinel || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function(lock) {
      if (!held || document.visibilityState !== 'visible') {
        lock.release().catch(function() {});
        return;
      }
      sentinel = lock;
      lock.addEventListener('release', function() {
        if (sentinel === lock) sentinel = null;
      });
    }).catch(function() {});
  }

  function sync() {
    held = !media.paused && !media.ended;
    if (held) grab();
    else drop();
  }

  media.addEventListener('play', sync);
  media.addEventListener('playing', sync);
  media.addEventListener('pause', sync);
  media.addEventListener('ended', sync);
  document.addEventListener('visibilitychange', sync);
  document.addEventListener('fullscreenchange', sync);
  sync();
}

// JW never hands out its hls.js instance, so viewer stalls are measured on the
// video element itself.
function bindQoeWatch(media) {
  if (!CFG.qoe) return;
  qoeMedia = media;
  if (qoeWatching) return;
  qoeWatching = true;
  let tick = performance.now();
  let last = -1;
  let stuck = 0;
  setInterval(function() {
    const v = qoeMedia;
    const now = performance.now();
    const dt = Math.min(2000, now - tick);
    tick = now;
    if (!v) return;
    const t = v.currentTime;
    // Autoplay can start before the 'playing' listener exists.
    if (!QOE.started && !v.paused && t > 0) QOE.started = true;
    if (QOE.started && !v.paused && !v.ended && !v.seeking && document.visibilityState === 'visible') {
      QOE.play += dt;
      if (v.readyState === 0) {
        // The player dropped the stream after an error: no picture, not buffering.
        QOE.dms += dt;
        stuck = 0;
      } else if (last >= 0 && Math.abs(t - last) < 0.04) {
        stuck += dt;
        const add = stuck >= 500 && stuck - dt < 500 ? stuck : stuck >= 500 ? dt : 0;
        if (add) {
          if (add === stuck) QOE.sn++;
          QOE.sms += add;
          // Frozen with video already downloaded: a player problem, not a slow source.
          if (bufferedAhead(v) >= 1) QOE.sbm += add;
        }
      } else {
        stuck = 0;
      }
    } else {
      stuck = 0;
    }
    last = t;
  }, 250);
}

// Why a picture has been frozen, sent with the viewer report.
function frozenState(v) {
  if (v.readyState === 0) return 'no-media';
  if (v.seeking) return 'seeking';
  const now = performance.now();
  if (!QOE.lastPl || now - QOE.lastPl > 20000) return 'no-playlist';
  if (bufferedAhead(v) >= 1) return 'video-ahead';
  const t = v.currentTime;
  const ranges = v.buffered;
  for (let i = 0; ranges && i < ranges.length; i++) {
    try { if (ranges.start(i) > t + 0.05) return 'gap-ahead'; } catch (_) {}
  }
  if (!QOE.lastSeg || now - QOE.lastSeg > 20000) return 'no-segments';
  return 'waiting-data';
}

function reloadStream(player) {
  QOE.rl++;
  try {
    player.load({ file: SRC });
    player.play();
  } catch (_) {}
}

// Works on the video element because JW never hands out its hls.js instance.
// A frozen picture first steps over a buffered gap. If it stays frozen with
// video already buffered ahead, it is nudged forward a little, like hls.js
// does. Nothing here jumps to live. Only a picture frozen for
// frozen_reload_ms reloads the stream, and each reload doubles that wait.
function bindStallRescue(media, player) {
  let last = -1;
  let stuck = 0;
  let nudges = 0;
  let calm = 0;
  let reloadWait = CFG.frozen_reload_ms;
  setInterval(function() {
    const t = media.currentTime;
    const moved = last >= 0 && Math.abs(t - last) >= 0.04;
    last = t;
    if (!QOE.started || media.paused || media.ended || document.visibilityState !== 'visible') {
      stuck = 0;
      nudges = 0;
      QOE.frozenMs = 0;
      return;
    }
    if (moved && !media.seeking) {
      stuck = 0;
      nudges = 0;
      QOE.frozenMs = 0;
      calm += 250;
      if (calm >= 20000) reloadWait = CFG.frozen_reload_ms;
      return;
    }
    calm = 0;
    QOE.frozenMs += 250;
    if (player && QOE.frozenMs >= reloadWait) {
      reloadWait = Math.min(reloadWait * 2, CFG.frozen_reload_max_ms);
      QOE.frozenMs = 0;
      stuck = 0;
      nudges = 0;
      reloadStream(player);
      return;
    }
    if (media.seeking || media.readyState === 0) {
      stuck = 0;
      return;
    }
    stuck += 250;
    if (stuck < 350) return;
    if (skipBufferedHole(media)) {
      QOE.hs++;
      stuck = 0;
      last = media.currentTime;
      return;
    }
    if (stuck >= CFG.stuck_wait_ms && nudges < 5 && bufferedAhead(media) >= 1) {
      nudges++;
      QOE.nu++;
      stuck = 0;
      try { media.currentTime = t + 0.1 * nudges; } catch (_) {}
      last = media.currentTime;
    }
  }, 250);
}

function bindHlsPlayback(player, tries) {
  tries = tries || 0;
  const media = document.querySelector('#player video');
  if (!media) {
    if (tries < 40) setTimeout(function() { bindHlsPlayback(player, tries + 1); }, 200);
    return;
  }
  if (!media._lwMedia) {
    media._lwMedia = true;
    bindWakeLock(media);
    const btn = document.getElementById('unmute');
    if (btn && btn._lwSound) {
      media.muted = false;
      media.volume = (btn._lwVolume || 100) / 100;
      media._lwSoundSet = true;
    } else {
      media.muted = !!CFG.start_muted;
    }
    media.preservesPitch = !!CFG.keep_pitch;
    media.addEventListener('playing', function() {
      hide();
      if (!QOE.started) {
        QOE.started = true;
        QOE.st = Math.round(performance.now() - QOE.t0);
      }
    });
    bindQoeWatch(media);
    bindStallRescue(media, player);

  if (media._lwBound) return;
  const hls = player && player.getProvider && (player.getProvider().hlsjs || player.getProvider().hls);

    if (tries < 40) setTimeout(function() { bindHlsPlayback(player, tries + 1); }, 200);

      return;
    }

      if (skipBufferedHole(media)) return;

    } else if (data.type === 'mediaError') {
      hls.recoverMediaError();
    } else {
      const detail = data.error && data.error.message ? ': ' + data.error.message : '';
      show('Playback error' + (data.details ? ': ' + data.details : '') + detail);
    }
  });
}

function inAdSandbox() {
  var framed = false;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed) return false;
  try {
    if (window.origin === 'null' || location.origin === 'null') return true;
  } catch (e) {
    return true;
  }
  try {
    var fe = window.frameElement;
    if (fe && fe.hasAttribute && fe.hasAttribute('sandbox')) {
      var flags = ' ' + String(fe.getAttribute('sandbox') || '').toLowerCase() + ' ';
      if (flags.indexOf(' allow-scripts ') === -1) return true;
      if (flags.indexOf(' allow-same-origin ') === -1) return true;
      if (flags.indexOf(' allow-popups ') === -1) return true;
    }
  } catch (e) {
    if (e && e.name === 'SecurityError') return true;
  }
  return false;
}

function isEmbedded() {
  try { return window.top !== window.self; } catch (e) { return true; }
}
function blockPlayer(text) {
  var box = document.getElementById('player');
  var unmuteBtn = document.getElementById('unmute');
  if (box) box.style.display = 'none';
  if (unmuteBtn) unmuteBtn.hidden = true;
  show(text);
}
if (!isEmbedded()) {
  blockPlayer('This player only works when embedded.');
} else if (inAdSandbox()) {
  blockPlayer('Remove sandbox');
} else if (SRC) {
  if (typeof jwplayer !== 'function') {
    show('JW Player failed to load.');
  } else {
    const hlsjsConfig = {
      loader: LiveLoader,
      enableWorker: !!CFG.demux_worker,
      defaultAudioCodec: CFG.audio_codec || 'mp4a.40.2',
      maxAudioFramesDrift: CFG.max_audio_frames_drift,
      liveSyncDurationCount: CFG.live_sync_segments,
      liveMaxLatencyDurationCount: CFG.live_max_latency_segments,
      maxLiveSyncPlaybackRate: CFG.catchup ? CFG.catchup_rate : 1,
      backBufferLength: CFG.back_buffer_seconds,
      manifestLoadingTimeOut: CFG.manifest_timeout_ms,
      manifestLoadingMaxRetry: CFG.manifest_retries,
      manifestLoadingRetryDelay: 1000,
      levelLoadingTimeOut: CFG.manifest_timeout_ms,
      levelLoadingMaxRetry: CFG.manifest_retries,
      levelLoadingRetryDelay: 1000,
      fragLoadingTimeOut: CFG.frag_timeout_ms,
      fragLoadingMaxRetry: CFG.frag_retries,
      fragLoadingRetryDelay: 1000,
    };
    if (CFG.p2p && typeof HlsJsP2PEngine !== 'undefined') hlsjsConfig.p2pConfig = p2pConfig;
    try {
      const player = jwplayer('player');
      player.setup({
        file: SRC,
        autostart: !!CFG.autostart,
        mute: !!CFG.start_muted,
        width: '100%',
        height: '100%',
        aspectratio: '',
        stretching: 'uniform',
        liveTimeout: CFG.live_timeout_seconds,
        autoPause: { viewability: false },
        hlsjsdefault: true,
        safarihlsjs: true,
        hlsjsConfig: hlsjsConfig,
      });
      bindUnmute(player);
      let fittedW = 0;
      let fittedH = 0;
      function fitPlayer() {
        const w = document.documentElement.clientWidth;
        const h = document.documentElement.clientHeight;
        if (w < 2 || h < 2 || (w === fittedW && h === fittedH)) return;
        fittedW = w;
        fittedH = h;
        try { player.resize(w, h); } catch (_) {}
      }
      window.addEventListener('resize', fitPlayer);
      window.addEventListener('orientationchange', fitPlayer);
      if (window.ResizeObserver) {
        const box = new ResizeObserver(fitPlayer);
        box.observe(document.documentElement);
        box.observe(document.body);
      }
      player.on('ready', function() {
        fittedW = 0;
        fittedH = 0;
        fitPlayer();
        bindUnmute(player);
        bindHlsPlayback(player);
      });
      // JW can swap in a new video element after a reload.
      player.on('firstFrame', function() { bindHlsPlayback(player); });
      let coldTries = 0;
      player.on('play', function() { coldTries = 0; hide(); });
      player.on('error', function(err) {
        QOE.er++;
        const msg = err && err.message ? err.message : '';
        if (coldTries < CFG.cold_start_tries && /cannot be played|no playable/i.test(msg)) {
          coldTries++;
          show('Starting stream…');
          setTimeout(function() {
            try { player.load({ file: SRC }); } catch (_) {}
          }, CFG.cold_start_delay_ms);
          return;
        }
        show('Playback error' + (msg ? ': ' + msg : ''));
      });
      player.on('setupError', function(err) {
        show('Player failed to start' + (err && err.message ? ': ' + err.message : ''));
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'f' && e.key !== 'F') return;
        try { player.setFullscreen(!player.getFullscreen()); } catch (_) {}
      });
    } catch (err) {
      show('Player failed to start' + (err && err.message ? ': ' + err.message : ''));
    }
  }
}
</script>
</body>
